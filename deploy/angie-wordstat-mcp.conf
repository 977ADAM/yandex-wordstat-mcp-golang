# Локация Angie для Wordstat MCP.
#
# Вставляется внутрь server-блока dev.coresmart.tech
# (/etc/angie/http.d/clustering.conf) перед catch-all `location / {` —
# авторизация (auth_basic + auth_request /_api_token, satisfy any)
# наследуется от server, отдельно её прописывать не нужно.
#
# Проверка и применение:
#     angie -t && angie -s reload

location ^~ /wordstat-mcp/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    # Streamable HTTP: standalone SSE-поток долгоживущий, буферизация его ломает
    proxy_buffering off;
    proxy_cache     off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
